; Goes to public_html/.user.ini (PHP-FPM / LiteSpeed read it; changes apply within ~5 minutes).
; Videos are uploaded as the raw request body: post_max_size must exceed MEDIA_MAX_VIDEO_MB (100 MB by default).
post_max_size = 128M
upload_max_filesize = 128M
memory_limit = 256M
max_execution_time = 60
